<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1600 900' width='100%' height='100%'>
  <defs>
    <radialGradient id='bgGrad6' cx='50%' cy='50%' r='70%'>
      <stop offset='0%' stop-color='#2b1055'/>
      <stop offset='60%' stop-color='#130628'/>
      <stop offset='100%' stop-color='#070212'/>
    </radialGradient>
    <radialGradient id='purpleGlow' cx='50%' cy='50%' r='50%'>
      <stop offset='0%' stop-color='#b5179e' stop-opacity='0.9'/>
      <stop offset='50%' stop-color='#7209b7' stop-opacity='0.5'/>
      <stop offset='100%' stop-color='#130628' stop-opacity='0'/>
    </radialGradient>
    <filter id='glow6'>
      <feGaussianBlur stdDeviation='10' result='blur'/>
      <feMerge><feMergeNode in='blur'/><feMergeNode in='SourceGraphic'/></feMerge>
    </filter>
  </defs>
  <rect width='1600' height='900' fill='url(#bgGrad6)'/>
  <circle cx='800' cy='450' r='380' fill='url(#purpleGlow)'/>
  
  <!-- 3D Financial Growth Bars -->
  <rect x='480' y='520' width='90' height='160' rx='12' fill='#7209b7' stroke='#4cc9f0' stroke-width='2' opacity='0.8'/>
  <rect x='610' y='440' width='90' height='240' rx='12' fill='#b5179e' stroke='#4cc9f0' stroke-width='2' opacity='0.9' filter='url(#glow6)'/>
  <rect x='740' y='340' width='90' height='340' rx='12' fill='#4361ee' stroke='#4cc9f0' stroke-width='2' opacity='0.95' filter='url(#glow6)'/>
  <rect x='870' y='260' width='90' height='420' rx='12' fill='#4cc9f0' stroke='#ffffff' stroke-width='3' filter='url(#glow6)'/>
  <rect x='1000' y='380' width='90' height='300' rx='12' fill='#7209b7' stroke='#4cc9f0' stroke-width='2' opacity='0.85'/>

  <!-- Trend Curve -->
  <path d='M525 500 Q 655 420 785 320 T 1045 360' fill='none' stroke='#4cc9f0' stroke-width='6' stroke-linecap='round' filter='url(#glow6)'/>
</svg>