<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1600 900' width='100%' height='100%'>
  <defs>
    <radialGradient id='bgGrad' cx='50%' cy='50%' r='70%'>
      <stop offset='0%' stop-color='#0f285e'/>
      <stop offset='60%' stop-color='#07122b'/>
      <stop offset='100%' stop-color='#030714'/>
    </radialGradient>
    <radialGradient id='coreGlow' cx='50%' cy='50%' r='50%'>
      <stop offset='0%' stop-color='#00d2ff' stop-opacity='0.9'/>
      <stop offset='40%' stop-color='#1769ff' stop-opacity='0.6'/>
      <stop offset='100%' stop-color='#07122b' stop-opacity='0'/>
    </radialGradient>
    <linearGradient id='cardGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#ffffff' stop-opacity='0.15'/>
      <stop offset='100%' stop-color='#ffffff' stop-opacity='0.02'/>
    </linearGradient>
    <filter id='glow'>
      <feGaussianBlur stdDeviation='12' result='blur'/>
      <feMerge>
        <feMergeNode in='blur'/>
        <feMergeNode in='SourceGraphic'/>
      </feMerge>
    </filter>
  </defs>

  <rect width='1600' height='900' fill='url(#bgGrad)'/>
  
  <!-- Subtle grid pattern -->
  <g stroke='#1e3a7a' stroke-width='1' opacity='0.25'>
    <line x1='0' y1='150' x2='1600' y2='150'/><line x1='0' y1='300' x2='1600' y2='300'/>
    <line x1='0' y1='450' x2='1600' y2='450'/><line x1='0' y1='600' x2='1600' y2='600'/>
    <line x1='0' y1='750' x2='1600' y2='750'/>
    <line x1='200' y1='0' x2='200' y2='900'/><line x1='400' y1='0' x2='400' y2='900'/>
    <line x1='600' y1='0' x2='600' y2='900'/><line x1='800' y1='0' x2='800' y2='900'/>
    <line x1='1000' y1='0' x2='1000' y2='900'/><line x1='1200' y1='0' x2='1200' y2='900'/>
    <line x1='1400' y1='0' x2='1400' y2='900'/>
  </g>

  <!-- Core Glow -->
  <circle cx='800' cy='450' r='380' fill='url(#coreGlow)'/>

  <!-- 3D Orbitals -->
  <ellipse cx='800' cy='450' rx='480' ry='160' fill='none' stroke='#00d2ff' stroke-width='3' stroke-dasharray='12 8' filter='url(#glow)' opacity='0.8' transform='rotate(-18 800 450)'/>
  <ellipse cx='800' cy='450' rx='440' ry='140' fill='none' stroke='#1769ff' stroke-width='2' opacity='0.6' transform='rotate(25 800 450)'/>
  <ellipse cx='800' cy='450' rx='380' ry='280' fill='none' stroke='#70a1ff' stroke-width='1.5' stroke-dasharray='6 10' opacity='0.5'/>

  <!-- Glassmorphic Contract Panel -->
  <g transform='translate(580, 220) rotate(-4)'>
    <rect x='0' y='0' width='440' height='460' rx='24' fill='url(#cardGrad)' stroke='#00d2ff' stroke-width='2' filter='url(#glow)' opacity='0.9'/>
    <rect x='40' y='50' width='160' height='16' rx='8' fill='#00d2ff'/>
    <rect x='40' y='90' width='360' height='10' rx='5' fill='#70a1ff' opacity='0.7'/>
    <rect x='40' y='120' width='320' height='10' rx='5' fill='#70a1ff' opacity='0.5'/>
    <rect x='40' y='150' width='340' height='10' rx='5' fill='#70a1ff' opacity='0.5'/>
    <rect x='40' y='180' width='280' height='10' rx='5' fill='#70a1ff' opacity='0.5'/>
    
    <circle cx='90' cy='320' r='35' fill='#1769ff' opacity='0.4'/>
    <path d='M75 320 L87 332 L108 308' fill='none' stroke='#00d2ff' stroke-width='4' stroke-linecap='round'/>
    <rect x='140' y='305' width='220' height='12' rx='6' fill='#ffffff' opacity='0.9'/>
    <rect x='140' y='330' width='140' height='10' rx='5' fill='#00d2ff' opacity='0.7'/>
  </g>

  <!-- Glowing Nodes -->
  <circle cx='320' cy='280' r='8' fill='#00d2ff' filter='url(#glow)'/>
  <line x1='320' y1='280' x2='600' y2='300' stroke='#00d2ff' stroke-width='1.5' opacity='0.6'/>
  <circle cx='1280' cy='620' r='10' fill='#00d2ff' filter='url(#glow)'/>
  <line x1='1280' y1='620' x2='1000' y2='580' stroke='#00d2ff' stroke-width='1.5' opacity='0.6'/>
</svg>