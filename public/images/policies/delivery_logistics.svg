<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1600 900' width='100%' height='100%'>
  <defs>
    <radialGradient id='bgGrad5' cx='50%' cy='50%' r='70%'>
      <stop offset='0%' stop-color='#032b2e'/>
      <stop offset='60%' stop-color='#011417'/>
      <stop offset='100%' stop-color='#00080a'/>
    </radialGradient>
    <radialGradient id='tealGlow' cx='50%' cy='50%' r='50%'>
      <stop offset='0%' stop-color='#00f2c3' stop-opacity='0.9'/>
      <stop offset='50%' stop-color='#0098a6' stop-opacity='0.5'/>
      <stop offset='100%' stop-color='#011417' stop-opacity='0'/>
    </radialGradient>
    <filter id='glow5'>
      <feGaussianBlur stdDeviation='10' result='blur'/>
      <feMerge><feMergeNode in='blur'/><feMergeNode in='SourceGraphic'/></feMerge>
    </filter>
  </defs>
  <rect width='1600' height='900' fill='url(#bgGrad5)'/>
  <circle cx='800' cy='450' r='380' fill='url(#tealGlow)'/>
  
  <!-- Global Delivery Mesh -->
  <circle cx='800' cy='450' r='240' fill='none' stroke='#00f2c3' stroke-width='3' stroke-dasharray='10 6' filter='url(#glow5)'/>
  <ellipse cx='800' cy='450' rx='240' ry='90' fill='none' stroke='#00f2c3' stroke-width='2' filter='url(#glow5)'/>
  <ellipse cx='800' cy='450' rx='90' ry='240' fill='none' stroke='#00f2c3' stroke-width='2' filter='url(#glow5)'/>

  <circle cx='560' cy='450' r='10' fill='#00f2c3' filter='url(#glow5)'/>
  <circle cx='1040' cy='450' r='10' fill='#00f2c3' filter='url(#glow5)'/>
  <circle cx='800' cy='210' r='10' fill='#00f2c3' filter='url(#glow5)'/>
  <circle cx='800' cy='690' r='10' fill='#00f2c3' filter='url(#glow5)'/>
</svg>