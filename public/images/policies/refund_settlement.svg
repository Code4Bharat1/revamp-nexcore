<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1600 900' width='100%' height='100%'>
  <defs>
    <radialGradient id='bgGrad3' cx='50%' cy='50%' r='70%'>
      <stop offset='0%' stop-color='#0f3057'/>
      <stop offset='60%' stop-color='#071836'/>
      <stop offset='100%' stop-color='#030a1c'/>
    </radialGradient>
    <radialGradient id='coinGlow' cx='50%' cy='50%' r='50%'>
      <stop offset='0%' stop-color='#38ef7d' stop-opacity='0.8'/>
      <stop offset='50%' stop-color='#11998e' stop-opacity='0.4'/>
      <stop offset='100%' stop-color='#071836' stop-opacity='0'/>
    </radialGradient>
    <filter id='glow3'>
      <feGaussianBlur stdDeviation='10' result='blur'/>
      <feMerge><feMergeNode in='blur'/><feMergeNode in='SourceGraphic'/></feMerge>
    </filter>
  </defs>
  <rect width='1600' height='900' fill='url(#bgGrad3)'/>
  <circle cx='800' cy='450' r='380' fill='url(#coinGlow)'/>
  
  <!-- 3D Refund Loop Arrow -->
  <circle cx='800' cy='450' r='240' fill='none' stroke='#38ef7d' stroke-width='12' stroke-dasharray='1100' stroke-dashoffset='200' filter='url(#glow3)'/>
  <polygon points='1040,410 1080,450 1010,470' fill='#38ef7d' filter='url(#glow3)'/>
  <polygon points='560,490 520,450 590,430' fill='#38ef7d' filter='url(#glow3)'/>

  <!-- Center Guarantee Seal -->
  <circle cx='800' cy='450' r='110' fill='#11998e' opacity='0.8' stroke='#38ef7d' stroke-width='4' filter='url(#glow3)'/>
  <text x='800' y='440' font-family='Arial, sans-serif' font-weight='bold' font-size='38' fill='#ffffff' text-anchor='middle'>100%</text>
  <text x='800' y='475' font-family='Arial, sans-serif' font-weight='600' font-size='18' fill='#38ef7d' text-anchor='middle'>REFUND SLA</text>
</svg>