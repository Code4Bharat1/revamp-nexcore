<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1600 900' width='100%' height='100%'>
  <defs>
    <radialGradient id='bgGrad4' cx='50%' cy='50%' r='70%'>
      <stop offset='0%' stop-color='#3d1e03'/>
      <stop offset='60%' stop-color='#1a0b01'/>
      <stop offset='100%' stop-color='#080400'/>
    </radialGradient>
    <radialGradient id='clockGlow' cx='50%' cy='50%' r='50%'>
      <stop offset='0%' stop-color='#ff9900' stop-opacity='0.9'/>
      <stop offset='50%' stop-color='#ff5500' stop-opacity='0.5'/>
      <stop offset='100%' stop-color='#1a0b01' stop-opacity='0'/>
    </radialGradient>
    <filter id='glow4'>
      <feGaussianBlur stdDeviation='10' result='blur'/>
      <feMerge><feMergeNode in='blur'/><feMergeNode in='SourceGraphic'/></feMerge>
    </filter>
  </defs>
  <rect width='1600' height='900' fill='url(#bgGrad4)'/>
  <circle cx='800' cy='450' r='380' fill='url(#clockGlow)'/>
  
  <!-- Orbital Time Ring -->
  <circle cx='800' cy='450' r='260' fill='none' stroke='#ff9900' stroke-width='8' filter='url(#glow4)'/>
  <circle cx='800' cy='450' r='230' fill='none' stroke='#ff5500' stroke-width='2' stroke-dasharray='8 12'/>

  <!-- Clock Dial Ticks -->
  <line x1='800' y1='205' x2='800' y2='235' stroke='#ff9900' stroke-width='6' filter='url(#glow4)'/>
  <line x1='800' y1='665' x2='800' y2='695' stroke='#ff9900' stroke-width='6' filter='url(#glow4)'/>
  <line x1='555' y1='450' x2='585' y2='450' stroke='#ff9900' stroke-width='6' filter='url(#glow4)'/>
  <line x1='1015' y1='450' x2='1045' y2='450' stroke='#ff9900' stroke-width='6' filter='url(#glow4)'/>

  <!-- Clock Hands -->
  <line x1='800' y1='450' x2='800' y2='280' stroke='#ffffff' stroke-width='8' stroke-linecap='round' filter='url(#glow4)'/>
  <line x1='800' y1='450' x2='940' y2='450' stroke='#ff9900' stroke-width='6' stroke-linecap='round' filter='url(#glow4)'/>
  <circle cx='800' cy='450' r='18' fill='#ff9900' filter='url(#glow4)'/>
</svg>